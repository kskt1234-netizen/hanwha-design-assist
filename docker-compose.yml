services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: design
      POSTGRES_PASSWORD: design
      POSTGRES_DB: design
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U design"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      APP_DATABASE_URL: postgresql+psycopg://design:design@db:5432/design
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-mock}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      API_URL: http://backend:8000
    ports: ["5173:5173"]
    volumes: [./frontend:/app, /app/node_modules]
    depends_on: [backend]

volumes:
  pgdata:
